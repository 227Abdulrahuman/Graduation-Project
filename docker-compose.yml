services:
  automator:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: automator-backend
    ports:
     - "8000:8000"
    volumes:
      # Mount current directory to workspace
      - .:/work
      # Keep command history
      - automator-history:/root
    environment:
      - PYTHONUNBUFFERED=1
      - TERM=xterm-256color
    working_dir: /work
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:latest
    container_name: redis
    env_file:
      - .env

  celery:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: celery
    command: celery -A api worker -l INFO
    volumes:
      - .:/work
      - automator-history:/root
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/work/backend
      - TERM=xterm-256color
    working_dir: /work
    depends_on:
      - redis
      - automator
    env_file:
      - .env

volumes:
  automator-history:
