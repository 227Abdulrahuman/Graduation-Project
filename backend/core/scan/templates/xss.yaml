id: reflected-xss

info:
  name: Reflected XSS Detection
  author: 227Abdulrahman
  severity: high
  tags: xss, fuzzing, dast
  description: Checks for double quotes unsanitized reflection.

http:
  - pre-condition:
      - type: dsl
        dsl:
          - "method == 'GET'"

    payloads:
      xss:
        - '"WebSploit"'

    fuzzing:
      - part: query
        mode: single
        fuzz:
          - "{{xss}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"WebSploit"'