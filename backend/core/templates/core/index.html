<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Websploit - Home</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h1>Websploit Targets</h1>

    <a href="" class="btn">+ Add New Target</a>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Platform</th>
                <th>Program URL</th>
            </tr>
        </thead>
        <tbody>
            {% for target in targets %}
                <tr>
                    <td>{{ target.name }}</td>
                    <td>{{ target.type|default:"-" }}</td>
                    <td>{{ target.platform|default:"-" }}</td>
                    <td>
                        {% if target.program_url %}
                            <a href="{{ target.program_url }}" target="_blank">Link</a>
                        {% else %}
                            -
                        {% endif %}
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4" style="text-align: center;">No targets found. Add one above!</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
